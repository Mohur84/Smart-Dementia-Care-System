<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Interaction - Dementia Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        #chatbox {
            width: 90%;
            height: 250px;
            border: 2px solid #16a085;
            border-radius: 10px;
            margin: 20px auto;
            overflow-y: auto;
            padding: 10px;
            background: #ecf0f1;
            text-align: left;
        }

        .user {
            color: #2c3e50;
            margin: 5px;
        }

        .bot {
            color: #16a085;
            margin: 5px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #16a085;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #117864;
        }
    </style>
</head>

<body>

    <h1>Voice Interaction Assistant</h1>
    <p>Conversational AI with adaptive cognitive support</p>

    <div id="chatbox"></div>

    <button onclick="startListening()">🎤 Speak</button>

    <script>
        const chatbox = document.getElementById("chatbox");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = sender;
            div.innerHTML = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Speech Recognition not supported in this browser!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.start();

            recognition.onresult = function(event) {
                const speech = event.results[0][0].transcript;
                addMessage("<strong>You:</strong> " + speech, "user");

                const response = generateResponse(speech.toLowerCase());
                addMessage("<strong>Assistant:</strong> " + response, "bot");

                speak(response);
            };
        }

        function generateResponse(input) {
            if (input.includes("who am i")) {
                return "You are a wonderful person. I'm here to help you.";
            } else if (input.includes("where am i")) {
                return "You are at home. You are safe.";
            } else if (input.includes("who are you")) {
                return "I am your assistant, here to support you.";
            } else if (input.includes("help")) {
                return "I'm here for you. What do you need?";
            } else {
                return "I understand. Tell me more.";
            }
        }

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-US";
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
