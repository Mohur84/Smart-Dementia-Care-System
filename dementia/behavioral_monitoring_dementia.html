<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Behavioral Monitoring - Dementia Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind for dashboard theme -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        video {
            border: 3px solid #e74c3c;
            border-radius: 10px;
            margin-top: 15px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #e74c3c;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }

        #status {
            margin-top: 20px;
            font-size: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
    <style>
    .teal-accent { color: #14F2C3; }
    .bg-card { background: #0F1A22; }
    .bg-panel { background: #0B141B; }
    .chip { height: 6px; border-radius: 9999px; }
    </style>
</head>

<body class="min-h-screen bg-[#0A1218] text-gray-200">

    <header class="bg-panel border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <h1 class="text-2xl md:text-3xl tracking-widest font-extrabold">
                <span class="teal-accent">PROTOTYPE DASHBOARD</span> — CAREGIVER INTERFACE
            </h1>
            <div class="text-sm opacity-70">NeuroBin</div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-12 gap-6">
        <aside class="col-span-12 md:col-span-3 lg:col-span-2 bg-panel rounded-xl p-4 text-left">
            <div class="text-xl font-bold teal-accent mb-4">NeuroBin</div>
            <nav class="space-y-1">
                <a href="index.html" class="block px-3 py-2 rounded-lg hover:bg-card">Dashboard</a>
                <a href="#" class="block px-3 py-2 rounded-lg bg-card">Behavior Monitoring</a>
                <a href="dementia_face_recognition.html" class="block px-3 py-2 rounded-lg hover:bg-card">Face Log</a>
                <a href="medication_vision_check_dementia.html" class="block px-3 py-2 rounded-lg hover:bg-card">Medications</a>
                <a href="emotion_detection_dementia.html" class="block px-3 py-2 rounded-lg hover:bg-card">Emotions</a>
                <a href="safe_zone_geofencing_dementia.html" class="block px-3 py-2 rounded-lg hover:bg-card">Location</a>
            </nav>
        </aside>

        <main class="col-span-12 md:col-span-9 lg:col-span-10">
            <section class="bg-panel rounded-xl p-6 text-left">
                <h2 class="text-xl font-semibold">Behavioral Monitoring</h2>
                <p class="text-sm opacity-80 mt-1">Continuous anomaly detection using camera and microphone</p>
                <div class="mt-5 flex flex-col items-start">
                    <video id="video" width="320" height="240" autoplay class="rounded-lg border border-gray-700"></video>
                    <button onclick="startMonitoring()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg">Start Monitoring</button>
                </div>
                <div id="status" class="mt-6 bg-card p-4 rounded-lg inline-block">System Idle</div>
            </section>
        </main>
    </div>

    

    <script>
        const video = document.getElementById('video');
        let monitoring = false;

        // Access camera
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert("Camera/Microphone access denied!");
                console.error(err);
            });

        function startMonitoring() {
            monitoring = true;
            document.getElementById("status").innerHTML = "Monitoring started...";

            detectAnomaly();
        }

        function detectAnomaly() {
            if (!monitoring) return;

            // Simulated anomaly detection
            const events = [
                { type: "Normal", message: "Everything is normal" },
                { type: "Fall Detected", message: "Possible fall detected" },
                { type: "Loud Noise", message: "Sudden loud sound detected" },
                { type: "Wandering", message: "Unusual movement detected" }
            ];

            const event = events[Math.floor(Math.random() * events.length)];

            document.getElementById("status").innerHTML =
                `<strong>${event.type}</strong><br>${event.message}`;

            // Repeat every 5 seconds
            setTimeout(detectAnomaly, 5000);
        }
    </script>

</body>
</html>
