<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medication Vision Check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 text-center p-6">

    <h1 class="text-3xl font-bold text-green-900">Medication Vision Check</h1>
    <p class="text-gray-600 mt-2">Camera-based pill intake verification</p>

    <!-- Camera -->
    <div class="mt-6 flex justify-center">
        <video id="video" width="320" height="240" autoplay class="rounded-xl border-4 border-green-400"></video>
    </div>

    <!-- Buttons -->
    <div class="mt-6 space-x-4">
        <button onclick="startCamera()" class="bg-green-600 text-white px-4 py-2 rounded-lg">Start Camera</button>
        <button onclick="verifyMedication()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Verify Intake</button>
    </div>

    <!-- Result -->
    <div id="result" class="mt-8 bg-white p-6 rounded-xl shadow-md w-11/12 md:w-2/3 mx-auto">
        Status: Not Verified
    </div>

    <script>
        const video = document.getElementById("video");

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    alert("Camera access denied!");
                    console.error(err);
                });
        }

        function verifyMedication() {
            // Simulated AI verification
            const outcomes = [
                { status: "Verified ✅", message: "Medication intake confirmed." },
                { status: "Not Detected ❌", message: "No pill detected. Please try again." },
                { status: "Unclear ⚠", message: "Image unclear. Adjust camera and retry." }
            ];

            const result = outcomes[Math.floor(Math.random() * outcomes.length)];

            document.getElementById("result").innerHTML =
                `<h2 class="text-xl font-semibold">${result.status}</h2>
                 <p class="mt-2">${result.message}</p>`;
        }
    </script>

</body>
</html>
