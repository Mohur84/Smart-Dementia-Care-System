<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medication Vision Check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    .teal-accent { color: #14F2C3; }
    .bg-card { background: #0F1A22; }
    .bg-panel { background: #0B141B; }
    .chip { height: 6px; border-radius: 9999px; }
    </style>
</head>

<body class="min-h-screen bg-[#0A1218] text-gray-200">

    <header class="bg-panel border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <h1 class="text-2xl md:text-3xl tracking-widest font-extrabold">
                <span class="teal-accent">PROTOTYPE DASHBOARD</span> — CAREGIVER INTERFACE
            </h1>
            <div class="text-sm opacity-70">NeuroBin</div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-12 gap-6">
        <aside class="col-span-12 md:col-span-3 lg:col-span-2 bg-panel rounded-xl p-4 text-left">
            <div class="text-xl font-bold teal-accent mb-4">NeuroBin</div>
            <nav class="space-y-1">
                <a href="index.html" class="block px-3 py-2 rounded-lg hover:bg-card">Dashboard</a>
                <a href="#" class="block px-3 py-2 rounded-lg bg-card">Medications</a>
                <a href="dementia_face_recognition.html" class="block px-3 py-2 rounded-lg hover:bg-card">Face Log</a>
                <a href="emotion_detection_dementia.html" class="block px-3 py-2 rounded-lg hover:bg-card">Emotions</a>
                <a href="safe_zone_geofencing_dementia.html" class="block px-3 py-2 rounded-lg hover:bg-card">Location</a>
            </nav>
        </aside>

        <main class="col-span-12 md:col-span-9 lg:col-span-10">
            <section class="bg-panel rounded-xl p-6 text-left">
                <h2 class="text-xl font-semibold">Medication Vision Check</h2>
                <p class="text-sm opacity-80 mt-1">Camera-based pill intake verification</p>
                <div class="mt-5">
                    <div class="flex justify-start">
                        <video id="video" width="320" height="240" autoplay class="rounded-lg border border-gray-700"></video>
                    </div>
                    <div class="mt-4 space-x-3">
                        <button onclick="startCamera()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Start Camera</button>
                        <button onclick="verifyMedication()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Verify Intake</button>
                    </div>
                </div>
                <div id="result" class="mt-6 bg-card p-4 rounded-lg">Status: Not Verified</div>
            </section>
        </main>
    </div>

    <!-- Result -->
    <div id="result" class="mt-8 bg-white p-6 rounded-xl shadow-md w-11/12 md:w-2/3 mx-auto">
        Status: Not Verified
    </div>

    <script>
        const video = document.getElementById("video");

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    alert("Camera access denied!");
                    console.error(err);
                });
        }

        function verifyMedication() {
            // Simulated AI verification
            const outcomes = [
                { status: "Verified", message: "Medication intake confirmed." },
                { status: "Not Detected", message: "No pill detected. Please try again." },
                { status: "Unclear", message: "Image unclear. Adjust camera and retry." }
            ];

            const result = outcomes[Math.floor(Math.random() * outcomes.length)];

            document.getElementById("result").innerHTML =
                `<h2 class="text-xl font-semibold">${result.status}</h2>
                 <p class="mt-2">${result.message}</p>`;
        }
    </script>

</body>
</html>
