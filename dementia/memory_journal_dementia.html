<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memory Journal - Dementia Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        textarea {
            width: 90%;
            height: 120px;
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #3498db;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .entry {
            background: #ecf0f1;
            margin: 15px auto;
            padding: 15px;
            border-radius: 10px;
            width: 90%;
            text-align: left;
        }

        .date {
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>

<body>

    <h1>Memory Journal</h1>
    <p>Write down your memories and thoughts</p>

    <textarea id="journalInput" placeholder="Write something you want to remember..."></textarea>
    <br>

    <button onclick="saveEntry()">Save Memory</button>

    <div id="entries"></div>

    <script>
        const entriesDiv = document.getElementById("entries");

        function loadEntries() {
            const entries = JSON.parse(localStorage.getItem("journalEntries")) || [];
            entriesDiv.innerHTML = "";

            entries.forEach(entry => {
                const div = document.createElement("div");
                div.className = "entry";
                div.innerHTML = `<div class="date">${entry.date}</div><div>${entry.text}</div>`;
                entriesDiv.appendChild(div);
            });
        }

        function saveEntry() {
            const text = document.getElementById("journalInput").value;

            if (text.trim() === "") {
                alert("Please write something first!");
                return;
            }

            const entries = JSON.parse(localStorage.getItem("journalEntries")) || [];

            const newEntry = {
                text: text,
                date: new Date().toLocaleString()
            };

            entries.unshift(newEntry);
            localStorage.setItem("journalEntries", JSON.stringify(entries));

            document.getElementById("journalInput").value = "";
            loadEntries();
        }

        // Load entries on page start
        window.onload = loadEntries;
    </script>

</body>
</html>
