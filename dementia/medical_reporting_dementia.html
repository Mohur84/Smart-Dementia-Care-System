<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Reporting - Dementia Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        input, textarea, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #27ae60;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #27ae60;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e8449;
        }

        .report {
            margin-top: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>

    <h1>Medical Reporting System</h1>
    <p>Generate weekly and monthly reports for caregivers and doctors</p>

    <input type="text" id="patientName" placeholder="Patient Name">

    <select id="reportType">
        <option value="Weekly">Weekly Caregiver Report</option>
        <option value="Monthly">Monthly Clinical Report</option>
    </select>

    <textarea id="notes" placeholder="Enter observations (sleep, behavior, mood, etc.)"></textarea>

    <button onclick="generateReport()">Generate Report</button>

    <div id="reportOutput" class="report">No report generated</div>

    <script>
        function generateReport() {
            const name = document.getElementById("patientName").value;
            const type = document.getElementById("reportType").value;
            const notes = document.getElementById("notes").value;

            if (!name || !notes) {
                alert("Please fill all fields!");
                return;
            }

            const date = new Date().toLocaleDateString();

            const report = `
                <h3>${type}</h3>
                <p><strong>Patient:</strong> ${name}</p>
                <p><strong>Date:</strong> ${date}</p>
                <p><strong>Observations:</strong></p>
                <p>${notes}</p>
            `;

            document.getElementById("reportOutput").innerHTML = report;
        }
    </script>

</body>
</html>
