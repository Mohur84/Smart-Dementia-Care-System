<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Therapy Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-indigo-50 text-center p-6">

    <h1 class="text-3xl font-bold text-indigo-900">Music Therapy Engine</h1>
    <p class="text-gray-600 mt-2">Personalized music based on mood & time</p>

    <!-- Mood Selection -->
    <div class="mt-6">
        <label class="block text-lg font-semibold">Select Mood:</label>
        <select id="mood" class="mt-2 p-2 rounded border">
            <option value="happy">Happy 😊</option>
            <option value="calm">Calm 😌</option>
            <option value="sad">Sad 😢</option>
        </select>
    </div>

    <!-- Time Selection -->
    <div class="mt-4">
        <label class="block text-lg font-semibold">Time of Day:</label>
        <select id="time" class="mt-2 p-2 rounded border">
            <option value="morning">Morning 🌅</option>
            <option value="afternoon">Afternoon ☀️</option>
            <option value="night">Night 🌙</option>
        </select>
    </div>

    <!-- Button -->
    <button onclick="playMusic()" class="mt-6 bg-indigo-600 text-white px-6 py-2 rounded-lg">
        Play Music
    </button>

    <!-- Output -->
    <div id="playlist" class="mt-8 bg-white p-6 rounded-xl shadow-md w-11/12 md:w-2/3 mx-auto">
        No playlist selected
    </div>

    <script>
        const playlists = {
            happy: {
                morning: ["Happy Tune 1", "Sunrise Melody"],
                afternoon: ["Joyful Beats", "Energy Song"],
                night: ["Soft Happy Music", "Relaxing Joy"]
            },
            calm: {
                morning: ["Peaceful Start", "Nature Sounds"],
                afternoon: ["Gentle Piano", "Calm Waves"],
                night: ["Sleep Music", "Deep Relaxation"]
            },
            sad: {
                morning: ["Hopeful Music", "Light Melody"],
                afternoon: ["Emotional Healing", "Soft Guitar"],
                night: ["Comfort Music", "Healing Sounds"]
            }
        };

        function playMusic() {
            const mood = document.getElementById("mood").value;
            const time = document.getElementById("time").value;

            const songs = playlists[mood][time];

            let content = `<h2 class="text-xl font-semibold">Your Playlist</h2><ul class="mt-3">`;

            songs.forEach(song => {
                content += `<li class="mt-1">🎵 ${song}</li>`;
            });

            content += "</ul>";

            document.getElementById("playlist").innerHTML = content;
        }
    </script>

</body>
</html>
