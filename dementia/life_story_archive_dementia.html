<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life Story Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-50 text-center p-6">

  <h1 class="text-3xl font-bold text-purple-900">Life Story Archive</h1>
  <p class="text-gray-600 mt-2">Voice-recorded memories built over time</p>

  <!-- Record Button -->
  <div class="mt-6">
    <button onclick="startRecording()" class="bg-purple-600 text-white px-6 py-2 rounded-lg">
      🎤 Record Memory
    </button>
  </div>

  <!-- Status -->
  <div id="status" class="mt-4 text-gray-700">Click to start recording</div>

  <!-- Recordings List -->
  <div id="recordings" class="mt-8 bg-white p-6 rounded-xl shadow-md w-11/12 md:w-2/3 mx-auto">
    <p>No memories recorded yet</p>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    function startRecording() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.start();
          document.getElementById("status").innerText = "Recording... Click again to stop.";

          mediaRecorder.ondataavailable = e => {
            audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: "audio/wav" });
            const url = URL.createObjectURL(blob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = url;

            const container = document.getElementById("recordings");

            if (container.innerHTML.includes("No memories")) {
              container.innerHTML = "";
            }

            const div = document.createElement("div");
            div.className = "mt-4";
            div.innerHTML = "<p class='font-semibold'>Memory Entry:</p>";
            div.appendChild(audio);

            container.appendChild(div);

            audioChunks = [];
            document.getElementById("status").innerText = "Recording saved!";
          };

          // Stop recording on second click
          document.querySelector("button").onclick = stopRecording;
        })
        .catch(err => {
          alert("Microphone access denied!");
          console.error(err);
        });
    }

    function stopRecording() {
      mediaRecorder.stop();
      document.querySelector("button").innerText = "🎤 Record Memory";
      document.querySelector("button").onclick = startRecording;
    }
  </script>

</body>
</html>
