<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dementia Face Recognition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7fb;
        }

        h1 {
            color: #2c3e50;
        }

        video {
            border: 3px solid #3498db;
            border-radius: 10px;
            margin-top: 20px;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <h1>Face Recognition Assistant</h1>
    <p>Helping dementia patients recognize familiar faces</p>

    <video id="video" width="320" height="240" autoplay></video>
    <br>

    <button onclick="recognizeFace()">Recognize Face</button>

    <div id="result">No face detected</div>

    <script>
        const video = document.getElementById('video');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert("Camera access denied!");
                console.error(err);
            });

        const knownFaces = [
            { name: "John", relation: "Your Son" },
            { name: "Emily", relation: "Your Daughter" },
            { name: "Dr. Smith", relation: "Your Doctor" }
        ];

        function recognizeFace() {
            const person = knownFaces[Math.floor(Math.random() * knownFaces.length)];

            document.getElementById("result").innerHTML =
                `<strong>${person.name}</strong><br>${person.relation}`;
        }
    </script>

</body>
</html>
