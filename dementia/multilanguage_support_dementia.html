<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-language Support</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 text-center p-6">

  <h1 class="text-3xl font-bold text-blue-900">Multi-language Support</h1>
  <p class="text-gray-600 mt-2">Interact in patient's native language automatically</p>

  <!-- Language Selection -->
  <div class="mt-6">
    <label class="block font-semibold">Select Language:</label>
    <select id="language" class="mt-2 p-2 rounded border">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
    </select>
  </div>

  <!-- Interaction Box -->
  <div class="mt-6">
    <input id="userInput" type="text" placeholder="Type something..."
      class="p-2 rounded border w-64">
    <button onclick="translateText()" class="ml-2 bg-blue-600 text-white px-4 py-2 rounded-lg">
      Translate
    </button>
  </div>

  <!-- Output -->
  <div id="output" class="mt-8 bg-white p-6 rounded-xl shadow-md w-11/12 md:w-2/3 mx-auto">
    Output will appear here
  </div>

  <script>
    const translations = {
      en: {
        greeting: "Hello! How can I help you?",
        help: "I am here to support you."
      },
      hi: {
        greeting: "नमस्ते! मैं आपकी कैसे मदद कर सकता हूँ?",
        help: "मैं आपकी सहायता के लिए यहाँ हूँ।"
      },
      ta: {
        greeting: "வணக்கம்! நான் எப்படி உதவலாம்?",
        help: "நான் உங்களுக்கு உதவ இங்கே இருக்கிறேன்."
      },
      te: {
        greeting: "నమస్తే! నేను ఎలా సహాయం చేయగలను?",
        help: "నేను మీకు సహాయం చేయడానికి ఇక్కడ ఉన్నాను."
      }
    };

    function translateText() {
      const lang = document.getElementById("language").value;
      const input = document.getElementById("userInput").value.toLowerCase();

      let response;

      if (input.includes("hello")) {
        response = translations[lang].greeting;
      } else if (input.includes("help")) {
        response = translations[lang].help;
      } else {
        response = translations[lang].help;
      }

      document.getElementById("output").innerHTML =
        `<h2 class="text-xl font-semibold">Response:</h2>
         <p class="mt-2">${response}</p>`;
    }
  </script>

</body>
</html>
