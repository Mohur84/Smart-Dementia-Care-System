<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detection - Dementia Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7fb;
        }

        h1 {
            color: #2c3e50;
        }

        video {
            border: 3px solid #8e44ad;
            border-radius: 10px;
            margin-top: 20px;
        }

        #emotionResult {
            margin-top: 20px;
            font-size: 26px;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: #8e44ad;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6c3483;
        }
    </style>
</head>

<body>

    <h1>Emotion Detection Assistant</h1>
    <p>Helping dementia patients understand emotions</p>

    <video id="video" width="320" height="240" autoplay></video>
    <br>

    <button onclick="detectEmotion()">Detect Emotion</button>

    <div id="emotionResult">No emotion detected</div>

    <script>
        const video = document.getElementById('video');

        // Access webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert("Camera access denied!");
                console.error(err);
            });

        // Simulated emotions database
        const emotions = [
            { emotion: "Happy 😊", message: "You seem happy!" },
            { emotion: "Sad 😢", message: "You seem a bit sad. It's okay." },
            { emotion: "Angry 😠", message: "You seem upset. Try to relax." },
            { emotion: "Surprised 😲", message: "You look surprised!" },
            { emotion: "Neutral 😐", message: "You look calm." }
        ];

        function detectEmotion() {
            // Simulate detection
            const detected = emotions[Math.floor(Math.random() * emotions.length)];

            document.getElementById("emotionResult").innerHTML =
                `<strong>${detected.emotion}</strong><br>${detected.message}`;
        }
    </script>

</body>
</html>
